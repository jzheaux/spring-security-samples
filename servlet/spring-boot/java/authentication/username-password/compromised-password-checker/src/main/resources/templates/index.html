<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org" lang="en">
<head>
	<title>Hello Spring Security</title>
	<meta charset="utf-8" />
	<link href="/default-ui.css" rel="stylesheet">
</head>
<body>
<div class="content">
	<h1>Hello Spring Security</h1>
	<p sec:authorize="hasRole('ADMIN')">
		Admin, you can <a href="/admin/require-change-password">require that others change their password</a>.
	</p>
	<p>This is a secured page. When you are done, please <a href="/logout">logout</a>.</p>
	<div th:if="${advice != null}">
		<p>Please <a href="/change-password">change your password</a> since <span th:text="${advice}"></span>.</p>
	</div>
</div>
</body>
</html>
